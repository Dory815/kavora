name: cloud shader validation

on:
  push:
    branches: [fix/cloud-system-redesign]
  pull_request:
    paths:
      - "kavora-runtime/src/dxvk/shaders/rtx/**"
      - "kavora-runtime/tests/rtx/unit/**"
      - ".github/workflows/cloud-shader-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan1 mesa-vulkan-drivers vulkan-tools python3-venv
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          vulkaninfo --summary

      - name: Install shader test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade pip
          python -m pip install numpy pillow slangpy

      - name: Validate production cloud shaders and transport
        run: |
          python3 kavora-runtime/tests/rtx/unit/test_cloud_transport.py \
            --dump "$RUNNER_TEMP/cloud-transport"

      - name: Render cloud-rich morphology matrix
        run: |
          python3 kavora-runtime/tests/rtx/unit/render_cloud_morphology_matrix.py \
            --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/cloud-morphology" \
            --cache-dir "$RUNNER_TEMP/cloud-morphology-cache" \
            --width 256 \
            --height 144 \
            --views 45,horizon \
            --lighting-cases day_side:35:20,day_sunward:35:135,day_antisolar:35:270,sunset_side:2:30 \
            --repeat 1

      - name: Upload cloud validation images and diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-morphology-validation
          path: |
            ${{ runner.temp }}/cloud-morphology
            ${{ runner.temp }}/cloud-transport
          if-no-files-found: error
